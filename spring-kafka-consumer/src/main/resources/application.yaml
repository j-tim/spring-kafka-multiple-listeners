spring:
  application:
    name: spring-kafka-consumer

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Spring Boot 3 / Jackson 2 support for JSON serialization
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # Spring Boot 4 / Jackson 3 support for JSON serialization
#      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      client-id: my-producer-client-id
    # Generic for all consumers
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      bootstrap-servers: localhost:9092
      group-id: my-avro-consumer-group
      auto-offset-reset: earliest
      properties:
          schema.registry.url: http://localhost:8081
          specific.avro.reader: true
    listener:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

