spring:
  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Spring Boot 3 / Jackson 2 support for JSON serialization
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      # Spring Boot 4 / Jackson 3 support for JSON serialization
#      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      client-id: my-producer-client-id

    # Generic for all consumers
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      bootstrap-servers: localhost:9092
      group-id: my-avro-consumer-group
      auto-offset-reset: earliest
      properties:
          schema.registry.url: http://localhost:8081
          specific.avro.reader: true
    listener:
      observation-enabled: true

    # Propasal
    consumers:
      # Specific for each consumer.
      "my-avro-topic-consumer":
        consumer:
          group-id: my-avro-group
          value-deserializer: org.apache.kafka.common.serialization.AvroDeserializer
          auto-offset-reset: earliest
      "my-json-topic-consumer":
        consumer:
          group-id: my-json-group
          value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer
          auto-offset-reset: latest
          bootstrap-servers: other-cluster:9092
        listener:
          observation-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'

